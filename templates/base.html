<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Acolhe{% endblock %}</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.6">
    
    {% block extra_head %}{% endblock %}
</head>
<body>

    <main class="container">
        {% block conteudo %}{% endblock %}
    </main>

    {% if request.endpoint not in ['home', 'usu.create'] %}
    <nav class="bottom-nav">
        <a href="{{ url_for('index') }}" class="nav-item {% if request.endpoint == 'index' %}active{% endif %}">
            <span class="nav-icon">🏠</span>
            <span>Início</span>
        </a>

        <a href="{{ url_for('diar.index') }}" class="nav-item {% if request.endpoint and request.endpoint.startswith('diar.') %}active{% endif %}">
            <span class="nav-icon">📖</span>
            <span>Diário</span>
        </a>

        <a href="{{ url_for('grupo.listar') }}" class="nav-item {% if request.endpoint and request.endpoint.startswith('grupo.') %}active{% endif %}">
            <span class="nav-icon">👥</span>
            <span>Comunidade</span>
        </a>

        <a href="{{ url_for('meditacao.meditacao') }}" class="nav-item {% if request.endpoint and request.endpoint.startswith('meditacao.') %}active{% endif %}">
            <span class="nav-icon">🧘</span>
            <span>Meditação</span>
        </a>

        <a href="{{ url_for('usu.perfil') }}" class="nav-item {% if request.endpoint == 'usu.perfil' %}active{% endif %}">
            <span class="nav-icon">👤</span>
            <span>Perfil</span>
        </a>
    </nav>
    {% endif %}

    <!-- Script Global para os Comentários Retráteis -->
    <script>
    function alternarComentarios(botao) {
        const blocoComentarios = botao.nextElementSibling;
        blocoComentarios.classList.toggle('ativo');

        const matchQtd = botao.textContent.match(/\d+/);
        const qtdTotal = matchQtd ? matchQtd[0] : "0";

        if (blocoComentarios.classList.contains('ativo')) {
            botao.innerHTML = `💬 Ocultar comentários (${qtdTotal})`;
        } else {
            botao.innerHTML = `💬 Mostrar comentários (${qtdTotal})`;
        }
    }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Acolhe{% endblock %}</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.5">
    
    {% block extra_head %}{% endblock %}
</head>
<body>

    <main class="container">
        {% block conteudo %}{% endblock %}
    </main>

    {% if request.endpoint not in ['home', 'usu.create'] %}
    <nav class="bottom-nav">
        <a href="{{ url_for('index') }}" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>Feed</span>
        </a>

        <a href="{{ url_for('diar.index') }}" class="nav-item">
            <span class="nav-icon">📖</span>
            <span>Diário</span>
        </a>

        <a href="{{ url_for('meditacao.meditacao') }}" class="nav-item">
            <span class="nav-icon">🧘</span>
            <span>Meditação</span>
        </a>

        <a href="#" class="nav-item" onclick="alert('Perfil em desenvolvimento!'); return false;">
            <span class="nav-icon">👤</span>
            <span>Perfil</span>
        </a>

        {% if session.get('usuario_id') %}
            <a href="{{ url_for('usu.logout') }}" class="nav-item">
                <span class="nav-icon">🚪</span>
                <span>Sair</span>
            </a>
        {% else %}
            <a href="{{ url_for('home') }}" class="nav-item">
                <span class="nav-icon">🔑</span>
                <span>Entrar</span>
            </a>
        {% endif %}
    </nav>
    {% endif %}

    <!-- Script Global para os Comentários Retráteis -->
    <script>
    function alternarComentarios(botao) {
        const blocoComentarios = botao.nextElementSibling;
        blocoComentarios.classList.toggle('ativo');

        const matchQtd = botao.textContent.match(/\d+/);
        const qtdTotal = matchQtd ? matchQtd[0] : "0";

        if (blocoComentarios.classList.contains('ativo')) {
            botao.innerHTML = `💬 Ocultar comentários (${qtdTotal})`;
        } else {
            botao.innerHTML = `💬 Mostrar comentários (${qtdTotal})`;
        }
    }
    </script>

</body>
</html>
